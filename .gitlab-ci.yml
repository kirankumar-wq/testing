image: php:7.1-cli

test:
  stage: test
  tags:
    - docker
  script:
    - apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends git libxslt1.1 libxml2 libmcrypt4 libicu-dev libpng-dev libxml2-dev libmcrypt-dev libxslt1-dev libzip-dev libfreetype6-dev libjpeg62-turbo-dev
    - apt-get install wget -y
    - docker-php-ext-configure gd --with-freetype-dir=/usr/include/ --with-jpeg-dir=/usr/include/ && docker-php-ext-install bcmath intl gd soap mcrypt xsl pdo_mysql zip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - HASH="$(wget -q -O - https://composer.github.io/installer.sig)"
    - php -r "if (hash_file('SHA384', 'composer-setup.php') === '$HASH') { echo 'Installer verified'; } else { echo 'Installer corrupt'; unlink('composer-setup.php'); } echo PHP_EOL;"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - php composer-setup.php --version=1.10.22
    - php composer.phar config --global http-basic.repo.magento.com $MAGENTO_USER $MAGENTO_PASS
    - php composer.phar install
